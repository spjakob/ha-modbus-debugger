read_register:
  name: Read Register
  description: Reads a register from a Modbus device and displays the value in multiple formats.
  fields:
    hub_id:
      name: Hub ID
      description: The Modbus Hub to use.
      required: true
      selector:
        config_entry:
          integration: ha_modbus_debugger
    unit_id:
      name: Unit ID
      description: The Modbus Slave ID.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
    register:
      name: Register Address
      description: The address of the register to read.
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      description: Number of registers to read.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    register_type:
      name: Register Type
      description: Holding or Input Register.
      required: false
      default: holding
      selector:
        select:
          options:
            - label: Holding Register
              value: holding
            - label: Input Register
              value: input
    verbosity:
      name: Verbose Level
      description: Control the level of detail in the output.
      required: true
      default: detailed
      selector:
        select:
          options:
            - label: Basic (Result Only)
              value: basic
            - label: Detailed (Connection Info)
              value: detailed
            - label: Debug (Full Trace)
              value: debug

scan_devices:
  name: Scan for Devices
  description: Scans the bus for Modbus devices by attempting to read a register from each Unit ID.
  fields:
    hub_id:
      name: Hub ID
      description: The Modbus Hub to use.
      required: true
      selector:
        config_entry:
          integration: ha_modbus_debugger
    start_unit:
      name: Start Unit ID
      description: The Unit ID to start scanning from.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
    end_unit:
      name: End Unit ID
      description: The Unit ID to end scanning at.
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 247
          mode: box
    register:
      name: Register Address
      description: The register address to read for verification.
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    register_type:
      name: Register Type
      description: The type of register to read.
      required: true
      default: holding
      selector:
        select:
          options:
            - label: Holding Register
              value: holding
            - label: Input Register
              value: input
    timeout:
      name: Timeout
      description: Timeout in seconds for each request.
      required: true
      default: 2.0
      selector:
        number:
          min: 0.1
          max: 10.0
          step: 0.1
          mode: box
    retries:
      name: Retries
      description: Number of retries per unit ID if connection fails.
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 5
          mode: box
    verbosity:
      name: Verbose Level
      description: Control the level of detail in the output.
      required: true
      default: basic
      selector:
        select:
          options:
            - label: Basic (Summary Only)
              value: basic
            - label: Detailed (Connection Info)
              value: detailed
            - label: Debug (Log Every Device)
              value: debug
    log_to_file:
      name: Log Scan Progress to File
      description: If enabled, logs scan progress and debug info to the Home Assistant log file.
      required: true
      default: false
      selector:
        boolean: {}
