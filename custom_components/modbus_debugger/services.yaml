read_register:
  name: Read Register
  description: Reads a register from a Modbus device and displays the value in multiple formats.
  fields:
    hub_id:
      name: Modbus Hub
      description: The Modbus Hub to use.
      required: true
      selector:
        config_entry:
          integration: modbus_debugger
    slave_id:
      name: Modbus Address
      description: The Modbus Slave ID.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
    register:
      name: Register Address
      description: The address of the register to read.
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      description: Number of registers to read.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    register_type:
      name: Register Type
      description: Holding or Input Register.
      required: true
      default: holding
      selector:
        select:
          options:
            - label: Holding Register
              value: holding
            - label: Input Register
              value: input
    data_type:
      name: Data Type (View)
      description: Select specific data type to display in the table, or 'Everything' for all.
      required: true
      default: all
      selector:
        select:
          options:
            - label: Everything
              value: all
            - label: UInt16
              value: uint16
            - label: Int16
              value: int16
            - label: Float16
              value: float16
            - label: Hex
              value: hex
            - label: Binary
              value: bin
            - label: UInt32 (Big Endian)
              value: uint32_be
            - label: Int32 (Big Endian)
              value: int32_be
            - label: Float32 (Big Endian)
              value: float32_be
            - label: Int32 (Little Endian Swap)
              value: int32_le_swap
            - label: Float32 (Little Endian Swap)
              value: float32_le_swap
            - label: Char
              value: char
    timeout:
      name: Timeout
      description: Timeout in seconds for each request.
      required: true
      default: 2.0
      selector:
        number:
          min: 0.1
          max: 10.0
          step: 0.1
          mode: box
    retries:
      name: Retries
      description: Number of retries if connection fails.
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 5
          mode: box

scan_devices:
  name: Scan for Devices
  description: Scans the bus for Modbus devices by attempting to read a register from each Slave ID.
  fields:
    hub_id:
      name: Modbus Hub
      description: The Modbus Hub to use.
      required: true
      selector:
        config_entry:
          integration: modbus_debugger
    start_slave:
      name: Start Slave ID
      description: The Slave ID to start scanning from.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
    end_slave:
      name: End Slave ID
      description: The Slave ID to end scanning at.
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 247
          mode: box
    register:
      name: Register Address
      description: The register address to read for verification.
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    register_type:
      name: Register Type
      description: The type of register to read.
      required: true
      default: holding
      selector:
        select:
          options:
            - label: Holding Register
              value: holding
            - label: Input Register
              value: input
    timeout:
      name: Timeout
      description: Timeout in seconds for each request.
      required: true
      default: 2.0
      selector:
        number:
          min: 0.1
          max: 10.0
          step: 0.1
          mode: box
    retries:
      name: Retries
      description: Number of retries per slave ID if connection fails.
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 5
          mode: box
    verbosity:
      name: Verbose Level
      description: Control the level of detail in the output.
      required: false
      default: basic
      selector:
        select:
          options:
            - label: Basic (Summary Only)
              value: basic
            - label: Detailed (Connection Info)
              value: detailed
            - label: Debug (Log Every Device)
              value: debug
    log_to_file:
      name: Log Scan Progress to File
      description: If enabled, logs scan progress and debug info to the Home Assistant log file.
      required: true
      default: false
      selector:
        boolean: {}
    scan_mode:
      name: Scan Mode
      description: "Standard: Sequential safe scan. Smart: Rapid-fire pipelined scan (Finds first device)."
      required: false
      default: standard
      selector:
        select:
          options:
            - label: Standard (Sequential)
              value: standard
            - label: Smart (Fast Pipelined)
              value: smart

stress_test_device:
  name: Stress Test Device
  description: Performs a stress test by repeatedly reading a register range.
  fields:
    hub_id:
      name: Modbus Hub
      required: true
      selector: { config_entry: { integration: modbus_debugger } }
    slave_id:
      name: Modbus Address
      required: true
      default: 1
      selector: { number: { min: 1, max: 247, mode: box } }
    register:
      name: Start Register
      required: true
      default: 0
      selector: { number: { min: 0, max: 65535, mode: box } }
    count:
      name: Register Count
      description: Block Size per request.
      required: true
      default: 1
      selector: { number: { min: 1, max: 1000, mode: box } }
    iterations:
      name: Iterations
      required: true
      default: 50
      selector: { number: { min: 1, max: 10000, mode: box } }
    register_type:
      name: Register Type
      required: true
      default: holding
      selector:
        select:
          options:
            - label: Holding Register
              value: holding
            - label: Input Register
              value: input
    timeout:
      name: Timeout
      required: true
      default: 2.0
      selector: { number: { min: 0.1, max: 10.0, step: 0.1, mode: box } }
    retries:
      name: Retries
      required: true
      default: 0
      selector: { number: { min: 0, max: 5, mode: box } }
    alternate:
      name: Defeat Cache (Alternating Read)
      description: Read 'register' then 'register+1' in loop to defeat Gateway caching.
      required: false
      default: false
      selector:
        boolean: {}
    verbosity:
      name: Verbose Level
      required: false
      default: basic
      selector:
        select:
          options:
            - label: Basic (Summary Only)
              value: basic
            - label: Detailed (Connection Info)
              value: detailed
            - label: Debug (Log Every Request)
              value: debug
